    <style>
        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center; /* Centraliza o menu horizontalmente */
            background-color: #333; /* Cor de fundo do menu */
        }
        nav ul li {
            margin: 0 15px; /* Espaçamento entre os itens do menu */
        }
        nav ul li a {
            text-decoration: none;
            color: white; /* Cor do texto dos links */
            padding: 14px 20px;
            display: block;
        }
        nav ul li a:hover {
            background-color: #111; /* Cor de fundo ao passar o mouse */
        }
    </style>
</head>
