<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Nível</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="script.js" defer></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        nav {
            background-color: #333;
            overflow: hidden;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center; /* Centraliza os itens do menu */
        }
        nav ul li {
            float: none; /* Remove o float */
        }
        nav ul li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        nav ul li a:hover {
            background-color: #ddd;
            color: black;
        }
        .info {
            margin: 10px 0;
            padding: 10px;
            background-color: #e9e9e9;
            border-left: 5px solid #e9e9e9;
            text-align: left;
        }
        .footer-content {
            text-align: center;
        }
        .logo-container {
            text-align: center;
        }
        .logo-container button {
            background-color: #4CAF50; /* Green */
            border: none;
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.3s;
        }
        .logo-container button:hover {
            background-color: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="https://www.sabesp.com.br/site/uploads/file/sociedade_meioamb/folheto_agua_bonus_nov2014.pdf">Sustentabilidade</a></li>
                <li><a href="https://www.sabesp.com.br/o-que-fazemos/obras-programas/uso-racional-agua">Conscientização</a></li>
                <li><a href="https://www.sabesp.com.br/assets/images/folhetos/sabesp-dicas-economia-agua.pdf">Economize!</a></li>
            </ul>
        </nav>
    </header>
    <br>
    <br>
    <main>
        <div class="logo-container">
            <br>
            <img src="logo.png" alt="Logo do Sistema de Controle de Nível de Caixa D'Água" class="responsive-img">
            <br>
            <br>
            <button onclick="location.href='mapa-reservatorio.html'">Localize o reservatório no mapa</button>
        </div>
    </main>
    <br>
    <br>
    <br>
    <footer>
        <div class="footer-content">
            <p>© 2024 Caetano AquaControl.</p>
            <p>Desenvolvido por 2ºBTEC</p>
        </div>
    </footer>
</body>
</html>
